<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Bowl Team Comparator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-0:#07130c;
    --pitch-1:#0d1f14;
    --pitch-2:#13291a;
    --pitch-3:#1c3624;
    --line:#2c4a34;
    --gold:#d4af37;
    --gold-soft:#e8cf7a;
    --text:#e9f2ea;
    --text-dim:#9db3a4;
    --danger:#c0503f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, #1a3322 0%, transparent 45%),
      radial-gradient(circle at 110% 10%, #16281c 0%, transparent 40%),
      var(--pitch-0);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  h1,h2,h3{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:0.5px;}
  header{max-width:1400px;margin:0 auto 20px;text-align:center;}
  header h1{
    font-size:clamp(28px,5vw,44px);
    margin:0 0 4px;
    color:var(--gold-soft);
    text-transform:uppercase;
    text-shadow:0 2px 0 rgba(0,0,0,0.5);
  }
  header p{color:var(--text-dim);margin:0;font-size:14px;}

  .controls{
    max-width:1400px;margin:0 auto 24px;
    display:grid;grid-template-columns:1fr 1fr;gap:16px;
  }
  @media (max-width:760px){.controls{grid-template-columns:1fr;}}

  .team-picker{
    background:linear-gradient(180deg,var(--pitch-2),var(--pitch-1));
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .team-picker.side-a{border-top:3px solid #5fb3d9;}
  .team-picker.side-b{border-top:3px solid #d9895f;}
  .team-picker label{
    font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);
    white-space:nowrap;
  }
  select{
    flex:1;
    background:var(--pitch-0);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  select:focus{outline:2px solid var(--gold);}

  .board{
    max-width:1400px;margin:0 auto;
    display:grid;grid-template-columns:1fr 1fr;gap:16px;
  }
  @media (max-width:900px){.board{grid-template-columns:1fr;}}

  .team-card{
    background:linear-gradient(180deg,var(--pitch-2) 0%,var(--pitch-1) 100%);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .team-card.side-a{box-shadow:inset 3px 0 0 #5fb3d9;}
  .team-card.side-b{box-shadow:inset 3px 0 0 #d9895f;}

  .team-head{
    padding:16px 18px 12px;
    border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;
  }
  .team-head h2{margin:0;font-size:24px;color:var(--gold-soft);text-transform:uppercase;}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .chip{
    font-size:11px;padding:3px 9px;border-radius:20px;
    background:var(--pitch-3);border:1px solid var(--line);color:var(--text-dim);
    text-transform:uppercase;letter-spacing:0.5px;
  }
  .chip.tier{color:var(--gold-soft);border-color:var(--gold);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    position:sticky;top:0;
    background:var(--pitch-3);
    color:var(--text-dim);
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:0.5px;
    padding:8px 6px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  thead th.pos-col{text-align:left;}
  tbody td{
    padding:8px 6px;
    text-align:center;
    border-bottom:1px solid rgba(44,74,52,0.5);
    vertical-align:top;
  }
  tbody tr:hover{background:rgba(212,175,55,0.05);}
  .pos-col{text-align:left;}
  .pos-name{font-weight:600;color:var(--text);}
  .pos-types{display:block;font-size:10px;color:var(--text-dim);font-weight:400;margin-top:1px;}
  .qty{color:var(--gold-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .cost{color:var(--text-dim);white-space:nowrap;}
  .skills-col{text-align:left;font-size:11.5px;color:#c9d9cd;line-height:1.5;min-width:170px;}
  .skill-tag{
    display:inline-block;background:var(--pitch-3);border:1px solid var(--line);
    border-radius:4px;padding:1px 6px;margin:1px 3px 1px 0;font-size:11px;color:var(--text);
  }
  .stat{font-variant-numeric:tabular-nums;}
  .notes-col{min-width:130px;}
  .notes-col input{
    width:100%;
    background:var(--pitch-0);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--gold-soft);
    padding:6px 7px;
    font-size:12px;
    font-family:'Inter',sans-serif;
  }
  .notes-col input::placeholder{color:#5a7767;}
  .notes-col input:focus{outline:1px solid var(--gold);}

  .table-wrap{overflow-x:auto;max-height:70vh;overflow-y:auto;}

  .empty-state{
    display:flex;align-items:center;justify-content:center;
    min-height:300px;color:var(--text-dim);font-size:14px;padding:20px;text-align:center;
  }

  footer{max-width:1400px;margin:24px auto 0;text-align:center;color:var(--text-dim);font-size:12px;}
  footer a{color:var(--gold-soft);}
</style>
</head>
<body>

<header>
  <h1>Blood Bowl Team Comparator</h1>
  <p>Pick your team and the opposition — full rosters side by side, at a glance.</p>
</header>

<div class="controls">
  <div class="team-picker side-a">
    <label for="teamA">My Team</label>
    <select id="teamA"></select>
  </div>
  <div class="team-picker side-b">
    <label for="teamB">Opponent</label>
    <select id="teamB"></select>
  </div>
</div>

<div class="board">
  <div class="team-card side-a" id="cardA"></div>
  <div class="team-card side-b" id="cardB"></div>
</div>

<footer>Data source: bloodbowlbase.ru (2025 core rules) &middot; Notes are session-only and clear on reload.</footer>

// ---------- STATE ----------
const notes = {}; // key: teamName|rowIndex -> value

function buildOptions(selectEl, defaultTeam){
  Object.keys(TEAMS).sort().forEach(name=>{
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    if(name === defaultTeam) opt.selected = true;
    selectEl.appendChild(opt);
  });
}

function renderTeam(name, side){
  const card = document.getElementById(side === 'a' ? 'cardA' : 'cardB');
  card.className = 'team-card side-' + side;
  if(!name || !TEAMS[name]){
    card.innerHTML = '<div class="empty-state">Select a team</div>';
    return;
  }
  const team = TEAMS[name];
  let rows = '';
  team.positionals.forEach((row, i)=>{
    const key = name + '|' + i;
    const skillsHtml = row.sk.length
      ? row.sk.map(s=>`<span class="skill-tag">${s}</span>`).join('')
      : '<span style="color:#5a7767">—</span>';
    rows += `
      <tr>
        <td class="qty">${row.n}</td>
        <td class="pos-col">
          <span class="pos-name">${row.p}</span>
          <span class="pos-types">${row.types}</span>
        </td>
        <td class="stat">${row.ma}</td>
        <td class="stat">${row.st}</td>
        <td class="stat">${row.ag}</td>
        <td class="stat">${row.pa}</td>
        <td class="stat">${row.av}</td>
        <td class="skills-col">${skillsHtml}</td>
        <td class="cost">${row.c}</td>
        <td class="notes-col">
          <input type="text" data-key="${key}" placeholder="skills / notes…" value="${notes[key] || ''}">
        </td>
      </tr>`;
  });

  card.innerHTML = `
    <div class="team-head">
      <div>
        <h2>${name}</h2>
        <div class="meta-row">
          <span class="chip tier">Tier ${team.tier}</span>
          <span class="chip">${team.league}</span>
          <span class="chip">Re-roll ${team.rr}K</span>
        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Qty</th>
            <th class="pos-col">Position</th>
            <th>MA</th><th>ST</th><th>AG</th><th>PA</th><th>AV</th>
            <th class="pos-col">Skills</th>
            <th>Cost</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${team.note ? `<div style="padding:10px 16px;font-size:11.5px;color:var(--text-dim);border-top:1px solid var(--line);">${team.note}</div>` : ''}
  `;

  card.querySelectorAll('.notes-col input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      notes[e.target.dataset.key] = e.target.value;
    });
  });
}

const selA = document.getElementById('teamA');
const selB = document.getElementById('teamB');
buildOptions(selA, 'Human');
buildOptions(selB, 'Orc');

selA.addEventListener('change', ()=> renderTeam(selA.value, 'a'));
selB.addEventListener('change', ()=> renderTeam(selB.value, 'b'));

renderTeam(selA.value, 'a');
renderTeam(selB.value, 'b');
</script>
