<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BB2025 Skill &amp; Trait Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pitch:#0e2417;--turf:#16371f;--line:#2b5a37;--gold:#d9a92e;--bone:#ece4cf;--blood:#a3241f;--mute:#8fa593}
*{box-sizing:border-box}
body{margin:0;background:var(--pitch);color:var(--bone);font:15px/1.45 Inter,system-ui,sans-serif}
header{padding:22px 20px 14px;border-bottom:3px solid var(--gold)}
h1{margin:0;font:400 34px/1 Anton,Impact,sans-serif;letter-spacing:.02em;color:var(--gold)}
header p{margin:6px 0 0;color:var(--mute);max-width:70ch}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:0;align-items:start}
aside{position:sticky;top:0;max-height:100vh;overflow:auto;padding:14px 16px 40px;border-right:1px solid var(--line);background:var(--turf)}
main{padding:16px 20px 60px;min-width:0}
input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--pitch);color:var(--bone);font:inherit;margin-bottom:10px}
.none{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--blood);border-radius:4px;margin-bottom:10px;font-weight:600;cursor:pointer}
details{border-top:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font:400 18px Anton,sans-serif;letter-spacing:.03em;padding:4px 0;color:var(--gold)}
label.sk{display:flex;gap:8px;align-items:center;padding:3px 2px;cursor:pointer}
label.sk .n{margin-left:auto;color:var(--mute);font-size:12px}
label.sk.z{opacity:.45}
input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.bar b{font:400 22px Anton,sans-serif;letter-spacing:.02em}
button{background:none;border:1px solid var(--gold);color:var(--gold);padding:5px 12px;border-radius:4px;font:inherit;cursor:pointer}
button:hover,button:focus-visible{background:var(--gold);color:var(--pitch)}
.tag{background:var(--gold);color:var(--pitch);padding:2px 9px;border-radius:99px;font-weight:600;font-size:13px}
.tag.red{background:var(--blood);color:var(--bone)}
.team{margin-bottom:18px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.team h2{margin:0;padding:8px 12px;background:var(--turf);font:400 21px Anton,sans-serif;letter-spacing:.03em;display:flex;justify-content:space-between}
.team h2 span{font:600 13px Inter;color:var(--mute);align-self:center}
.pos{padding:8px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:200px 1fr;gap:6px 12px}
.pos strong{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.c{border:1px solid var(--line);border-radius:3px;padding:0 7px;font-size:13px;color:var(--mute)}
.c.hit{border-color:var(--gold);color:var(--gold);font-weight:600}
.c.nil{font-style:italic}
.empty{padding:30px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:6px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0}.pos{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>Skill &amp; Trait Finder</h1>
<p>Tick skills and traits to see which BB2025 positions start with every one of them. Data from Blood Bowl Base (Season 3 rosters, with the latest FAQ changes).</p>
</header>
<div class="wrap">
<aside>
<input type="search" id="q" placeholder="Search skills and traits" aria-label="Search skills and traits">
<label class="none"><input type="checkbox" id="none"> No skills / traits</label>
<div id="cats"></div>
</aside>
<main>
<div class="bar"><b id="sum"></b><span id="tags"></span><button id="clr" type="button">Clear all</button></div>
<div id="out"></div>
</main>
</div>
<script>
const CATS=[

["Devious","Dirty Player|Eye Gouge|Fumblerooski|Lethal Flight|Lone Fouler|Pile Driver|Put the Boot In|Quick Foul|Saboteur|Shadowing|Sneaky Git|Violent Innovator"],
["General","Block|Dauntless|Fend|Frenzy|Kick|Pro|Steady Footing|Strip Ball|Sure Hands|Tackle|Taunt|Wrestle"],
["Mutation","Big Hand|Claws|Disturbing Presence|Extra Arms|Foul Appearance|Horns|Iron Hard Skin|Monstrous Mouth|Prehensile Tail|Tentacles|Two Heads|Very Long Legs"],
["Passing","Accurate|Cannoneer|Cloud Burster|Dump-off|Give and Go|Hail Mary Pass|Leader|Nerves of Steel|On the Ball|Pass|Punt|Safe Pass"],
["Strength","Arm Bar|Brawler|Break Tackle|Bullseye|Grab|Guard|Juggernaut|Mighty Blow|Multiple Block|Stand Firm|Strong Arm|Thick Skull"],
["Traits","Always Hungry|Animal Savagery|Animosity|Ball & Chain|Bloodlust|Bombardier|Bone Head|Breathe Fire|Chainsaw|Decay|Drunkard|Hatred|Hypnotic Gaze|Insignificant|Kick Team-mate|Loner|My Ball|No Ball|Pick-me-up|Plague Ridden|Pogo|Projectile Vomit|Really Stupid|Regeneration|Right Stuff|Secret Weapon|Stab|Stunty|Swoop|Take Root|Throw Team-mate|Timmm-ber!|Titchy|Trickster|Unchannelled Fury|Unsteady"]
].map(([n,s])=>[n,s.split("|")]);
const M={TROLL:"Always Hungry;Loner (4+);Mighty Blow;Projectile Vomit;Really Stupid;Regeneration;Throw Team-mate",
TROLLN:"Always Hungry;Mighty Blow;Projectile Vomit;Really Stupid;Regeneration;Throw Team-mate",
TREE:"Mighty Blow;Stand Firm;Strong Arm;Take Root;Thick Skull;Throw Team-mate;Timmm-ber!",

MINO:"Frenzy;Horns;Loner (4+);Mighty Blow;Thick Skull;Unchannelled Fury",
SKAV:"Animosity (Goblin)"};
const RAW=`#Amazon

Elf Thrower|Hail Mary Pass;Pass
Elf Catcher|Catch;Diving Catch;Nerves of Steel

const base=s=>s.replace(/\s*\(.*\)$/,"");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const P=[];let team;
RAW.split("\n").forEach(l=>{
  if(l[0]==="#"){team=l.slice(1);return}
  const [pos,sk=""]=l.split("|");
  const list=sk.replace(/@(\w+)/g,(_,k)=>M[k]).split(";").filter(Boolean);
  P.push({team,pos,sk:list,b:list.map(base)});
});
const $=id=>document.getElementById(id);
const count={};P.forEach(p=>p.b.forEach(b=>count[b]=(count[b]||0)+1));

$("cats").innerHTML=CATS.map(([n,list])=>`<details open><summary>${n}</summary>${list.map(s=>
 `<label class="sk${count[s]?"":" z"}" data-n="${esc(s.toLowerCase())}"><input type="checkbox" class="s" value="${esc(s)}"> ${esc(s)}<span class="n">${count[s]||0}</span></label>`).join("")}</details>`).join("");

function sel(){return [...document.querySelectorAll(".s:checked")].map(e=>e.value)}
function render(){
  const s=sel(),none=$("none").checked;
  const rows=P.filter(p=>none?p.b.length===0:s.every(x=>p.b.includes(x)));
  const g={};rows.forEach(p=>(g[p.team]=g[p.team]||[]).push(p));
  const teams=Object.keys(g);
  $("sum").textContent=`${rows.length} position${rows.length===1?"":"s"} · ${teams.length} team${teams.length===1?"":"s"}`;
  $("tags").innerHTML=none?'<span class="tag red">No skills / traits</span>':s.map(x=>`<span class="tag">${esc(x)}</span>`).join(" ");
  $("out").innerHTML=teams.length?teams.map(t=>`<section class="team"><h2>${esc(t)}<span>${g[t].length} position${g[t].length===1?"":"s"}</span></h2>${g[t].map(p=>
    `<div class="pos"><strong>${esc(p.pos)}</strong><div class="chips">${p.sk.length?p.sk.map(k=>`<span class="c${s.includes(base(k))?" hit":""}">${esc(k)}</span>`).join(""):'<span class="c nil">no starting skills or traits</span>'}</div></div>`).join("")}</section>`).join("")
    :'<div class="empty">No position starts with that exact combination. Untick one to widen the search.</div>';
}
document.addEventListener("change",e=>{
  if(e.target.id==="none"&&e.target.checked)document.querySelectorAll(".s").forEach(c=>c.checked=false);
  else if(e.target.classList.contains("s")&&e.target.checked)$("none").checked=false;
  render();
});
$("clr").onclick=()=>{document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false);render()};
$("q").oninput=e=>{const v=e.target.value.trim().toLowerCase();
  document.querySelectorAll("label.sk").forEach(l=>l.style.display=l.dataset.n.includes(v)?"":"none")};
render();
</script>
</body>
</html>
