body{margin:0;min-height:100vh;background:linear-gradient(#071108,#0f2a1a 420px,#0d2416);color:var(--cream);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 12px}
header{text-align:center;margin-bottom:18px}
.eb{font:.7rem var(--mono);letter-spacing:.25em;color:#8a7440;text-transform:uppercase}

.sub{color:var(--mut);font-size:.9rem;margin:0}

.hd span{font:.7rem var(--mono);color:var(--mut)}
.bd{padding:16px}
label.f{display:block;font:.7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
select,button{width:100%;font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#0f2416;color:var(--cream);margin-bottom:8px}
select{font-family:var(--mono);font-weight:700}
button{background:var(--gold);color:#1a1405;font:700 1rem var(--disp);letter-spacing:.1em;text-transform:uppercase;border:0;cursor:pointer}
button.alt{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.row{display:flex;gap:8px}.row button{flex:1;margin:0}
.player{font:700 1.8rem/1.1 var(--disp);letter-spacing:.03em;color:var(--cream);text-transform:uppercase}
.stats{color:var(--mut);font-size:.85rem}

.ch i{width:10px;height:10px;border-radius:50%}.ch span{color:var(--mut);font:.7rem var(--mono)}
.list{display:grid;grid-template-columns:repeat(2,1fr);background:linear-gradient(#1f3d27,#16301f);border:1px solid #4a5f3a;border-radius:12px;overflow:hidden}
@media(min-width:520px){.list{grid-template-columns:repeat(3,1fr)}}
.list label{display:flex;align-items:center;gap:8px;padding:10px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);cursor:pointer;font-size:.88rem;line-height:1.2}
.list input{width:18px;height:18px;flex:none}
.list label.on{background:#2d5636}.list label.ok{background:#2a6a43}.list label.bad{background:#6b2f2f}.list label.miss{outline:2px dashed var(--gold);outline-offset:-3px}
.res{margin-top:12px;padding-top:12px;border-top:1px dashed #7a6a3a;font-size:.92rem}.res:empty{display:none}.res b.g{color:#6fdc9a}.res b.r{color:#ff8a7b}.res b.y{color:var(--gold)}
details.cat{margin:10px 0}
summary.ch{list-style:none;cursor:pointer;margin:0;padding:12px 14px;background:linear-gradient(#274a30,#1c3926);border:1px solid #4a5f3a;border-radius:12px}
summary.ch::-webkit-details-marker{display:none}
summary.ch::after{content:"\25BE";margin-left:auto;color:var(--gold);font-size:1.1rem}
details[open]>summary.ch{border-radius:12px 12px 0 0;border-bottom-color:var(--line)}
details[open]>summary.ch::after{content:"\25B4"}
details[open]>.list{border-top:0;border-radius:0 0 12px 12px}
.ch .n{text-decoration:none;font:.7rem var(--mono);color:var(--gold);letter-spacing:0;text-transform:none}
</style></head><body><main>

const T={};D.split("\n").forEach(l=>{const p=l.split("|");T[p[0]]=p.slice(1).map(x=>{const[n,s]=x.split(";");return{n,s:s?s.split(","):[]}})});
const base=s=>s.replace(/\s*\(.*\)$/,"");
const $=i=>document.getElementById(i);
const teams=Object.keys(T).sort();
$("team").innerHTML='<option value="">All teams (random)</option>'+teams.map(t=>`<option>${t}</option>`).join("");
$("cats").innerHTML=G.map(([c,k,a])=>`<details class="cat"><summary class="ch" style="color:${k}"><i style="background:${k}"></i>${c}<span>· ${a.length}</span><u class="n"></u></summary><div class="list">${a.map(([s,w])=>`<label><input type="checkbox" class="cb" value="${s}" style="accent-color:${k}">${s}</label>`).join("")}</div></details>`).join("");
const cbs=()=>[...document.querySelectorAll(".cb")];
const cnt=()=>document.querySelectorAll("details.cat").forEach(d=>{const n=d.querySelectorAll(".cb:checked").length;d.querySelector(".n").textContent=n?n+" ticked":""});
cbs().forEach(c=>c.onchange=()=>{c.parentNode.classList.toggle("on",c.checked);cnt()});
let cur,right=0,tot=0,done;
function clear(){cbs().forEach(c=>{c.checked=false;c.parentNode.className=""});$("res").innerHTML="";cnt()}
function gen(){
 const t=$("team").value||teams[Math.random()*teams.length|0];
 const ps=T[t];cur={t,p:ps[Math.random()*ps.length|0]};done=false;
 $("quiz").hidden=false;$("tm").textContent=cur.t;$("pos").textContent=cur.p.n;clear();document.querySelectorAll("details.cat").forEach(d=>d.open=false);
}
$("gen").onclick=gen;$("clr").onclick=clear;
function show(){
 const real=cur.p.s,rb=real.map(base),gb=cbs().filter(c=>c.checked).map(c=>c.value);
 const hit=gb.filter(x=>rb.includes(x)),miss=real.filter(x=>!gb.includes(base(x))),extra=gb.filter(x=>!rb.includes(x));
 cbs().forEach(c=>{const r=rb.includes(c.value);c.parentNode.className=c.checked?(r?"ok":"bad"):(r?"miss":"")});
 $("res").innerHTML=`<b class="g">Correct:</b> ${hit.join(", ")||"none"}<br><b class="r">Wrong:</b> ${extra.join(", ")||"none"}<br><b class="y">Missed:</b> ${miss.join(", ")||"none"}<br><span class="stats">All skills: ${real.join(", ")||"none"}</span>`;
 document.querySelectorAll("details.cat").forEach(d=>{if(d.querySelector("label.ok,label.bad,label.miss"))d.open=true});
 return !miss.length&&!extra.length;
}
function tally(p){if(!done){done=true;tot++;if(p)right++;$("score").textContent=`Perfect guesses: ${right} / ${tot}`}}
$("chk").onclick=()=>tally(show());
$("rev").onclick=()=>{show();tally(false)};
</script></main></body></html>
