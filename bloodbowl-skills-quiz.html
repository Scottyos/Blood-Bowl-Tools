<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Bowl 2025 — Skill Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --pitch: #14231a;
    --pitch-line: #2c4232;
    --parchment: #e9dfc7;
    --parchment-dim: #cbbf9e;
    --blood: #9c1f1f;
    --blood-bright: #c22b2b;
    --ink: #201a12;
    --gold: #c9a24b;
    --card-shadow: rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'IBM Plex Sans', sans-serif;
    background:
      radial-gradient(ellipse at top, #1c3324 0%, var(--pitch) 60%, #0c150f 100%);
    color: var(--parchment);
    min-height:100vh;
    padding-bottom:40px;
  }
  .stripes{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.05;
    background:repeating-linear-gradient(90deg, #fff 0 2px, transparent 2px 60px);
  }
  header{
    position:relative; z-index:1;
    text-align:center; padding:28px 16px 18px;
    border-bottom:3px solid var(--blood);
    background:linear-gradient(180deg, rgba(0,0,0,.25), transparent);
  }
  header h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:clamp(1.6rem, 6vw, 2.4rem);
    letter-spacing:1px;
    margin:0;
    color: var(--parchment);
    text-transform:uppercase;
    text-shadow: 2px 2px 0 var(--blood), 4px 4px 8px rgba(0,0,0,.6);
  }
  header .sub{
    font-family:'Special Elite', cursive;
    color: var(--gold);
    font-size:.85rem;
    margin-top:6px;
    letter-spacing:.5px;
  }

  main{max-width:640px; margin:0 auto; padding:18px 16px; position:relative; z-index:1;}

  .mode-bar{
    display:flex; gap:8px; margin-bottom:16px;
  }
  .mode-btn{
    flex:1; padding:10px 6px; border-radius:8px; border:2px solid var(--pitch-line);
    background:rgba(0,0,0,.25); color:var(--parchment-dim);
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.5px;
    font-size:.85rem; text-transform:uppercase; cursor:pointer;
    transition:all .15s;
  }
  .mode-btn.active{
    background:var(--blood); border-color:var(--blood-bright); color:#fff;
  }

  select{
    width:100%; padding:10px 12px; border-radius:8px; margin-bottom:14px;
    background:rgba(0,0,0,.35); color:var(--parchment); border:2px solid var(--pitch-line);
    font-family:'IBM Plex Sans',sans-serif; font-size:.95rem;
  }

  .stat-row{
    display:flex; justify-content:space-between; font-family:'Oswald',sans-serif;
    font-size:.85rem; color:var(--gold); margin-bottom:10px; letter-spacing:.5px;
  }

  /* FLASHCARD */
  .card{
    background: linear-gradient(160deg, #f3ead2, var(--parchment) 60%, #ddd0ab);
    color: var(--ink);
    border-radius:14px;
    padding:26px 22px;
    min-height:230px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center;
    box-shadow: 0 10px 24px var(--card-shadow), inset 0 0 0 3px rgba(156,31,31,.15);
    cursor:pointer;
    position:relative;
    border:2px solid #b7a878;
  }
  .card .tag{
    position:absolute; top:12px; left:12px;
    font-family:'Oswald',sans-serif; font-size:.65rem; text-transform:uppercase;
    background:var(--blood); color:#fff; padding:3px 8px; border-radius:5px; letter-spacing:.5px;
  }
  .card .kind{
    position:absolute; top:12px; right:12px;
    font-family:'Oswald',sans-serif; font-size:.65rem; text-transform:uppercase;
    background:var(--ink); color:var(--gold); padding:3px 8px; border-radius:5px; letter-spacing:.5px;
  }
  .card h2{
    font-family:'Oswald',sans-serif; font-size:1.5rem; margin:8px 0 12px;
    text-transform:uppercase; letter-spacing:.5px;
  }
  .card p{
    font-family:'IBM Plex Sans', sans-serif; font-size:1rem; line-height:1.55; margin:0; color:#3a2f1c;
  }
  .card .hint{
    margin-top:16px; font-size:.75rem; color:#8a7c55; font-family:'IBM Plex Sans';
  }
  .flip-controls{ display:flex; gap:10px; margin-top:14px; }
  .flip-controls button{
    flex:1; padding:12px; border-radius:8px; border:none; cursor:pointer;
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.5px; text-transform:uppercase;
    font-size:.85rem;
  }
  .btn-prev{ background:var(--pitch-line); color:var(--parchment); }
  .btn-next{ background:var(--blood); color:#fff; }

  /* QUIZ */
  .q-card{
    background: linear-gradient(160deg, #f3ead2, var(--parchment) 60%, #ddd0ab);
    color: var(--ink);
    border-radius:14px;
    padding:22px;
    box-shadow: 0 10px 24px var(--card-shadow);
    border:2px solid #b7a878;
  }
  .q-prompt{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:1rem;
    font-weight:500;
    line-height:1.55;
    margin-bottom:16px;
  }
  .choice{
    display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:9px;
    border-radius:8px; border:2px solid #b7a878; background:#fbf5e4;
    font-family:'Oswald',sans-serif; font-weight:500; color:var(--ink); font-size:.95rem;
    cursor:pointer; transition:all .12s;
  }
  .choice:hover{ background:#f0e6c8; }
  .choice.correct{ background:#2e6b34; border-color:#1e4d24; color:#fff; }
  .choice.wrong{ background:var(--blood); border-color:var(--blood-bright); color:#fff; }
  .choice[disabled]{ cursor:default; }

  .next-q{
    margin-top:12px; width:100%; padding:12px; border:none; border-radius:8px;
    background:var(--gold); color:var(--ink); font-family:'Oswald',sans-serif;
    font-weight:700; text-transform:uppercase; letter-spacing:.5px; cursor:pointer; font-size:.9rem;
    display:none;
  }
  .next-q.show{ display:block; }

  .score-banner{
    text-align:center; font-family:'Oswald',sans-serif; margin-top:18px; color:var(--gold);
    font-size:.95rem;
  }
  .reset-link{
    display:block; text-align:center; margin-top:10px; color:var(--parchment-dim);
    font-size:.8rem; cursor:pointer; text-decoration:underline;
  }

  /* TACTICS */
  .sub-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .sub-toggle button{
    flex:1; padding:9px 6px; border-radius:8px; border:2px solid var(--pitch-line);
    background:transparent; color:var(--parchment-dim);
    font-family:'Oswald',sans-serif; font-weight:600; font-size:.78rem; letter-spacing:.4px;
    text-transform:uppercase; cursor:pointer;
  }
  .sub-toggle button.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }

  .topic-list{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .topic-chip{
    padding:7px 12px; border-radius:20px; border:2px solid var(--pitch-line);
    background:rgba(0,0,0,.25); color:var(--parchment-dim); font-size:.78rem;
    font-family:'Oswald',sans-serif; letter-spacing:.3px; cursor:pointer;
  }
  .topic-chip.active{ background:var(--blood); border-color:var(--blood-bright); color:#fff; }

  .guide-card{
    background: linear-gradient(160deg, #f3ead2, var(--parchment) 60%, #ddd0ab);
    color: var(--ink); border-radius:14px; padding:20px 20px 16px;
    box-shadow: 0 10px 24px var(--card-shadow); border:2px solid #b7a878;
  }
  .guide-card h3{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.5px;
    margin:0 0 4px; font-size:1.25rem; color:var(--blood);
  }
  .guide-card .goal{
    font-family:'IBM Plex Sans', sans-serif; font-style:italic; font-size:.88rem; color:#5a4d33; margin-bottom:12px;
  }
  .guide-card ul{ margin:0; padding-left:20px; }
  .guide-card li{ margin-bottom:9px; line-height:1.45; font-size:.92rem; }
  .guide-card li b{ color:var(--blood); }

  .scenario-tag{
    display:inline-block; font-family:'Oswald',sans-serif; font-size:.65rem;
    text-transform:uppercase; background:var(--ink); color:var(--gold);
    padding:3px 9px; border-radius:5px; margin-bottom:10px; letter-spacing:.5px;
  }
  .explain-box{
    margin-top:14px; padding:12px 14px; background:rgba(46,107,52,.12);
    border-left:4px solid #2e6b34; border-radius:6px; font-size:.88rem; line-height:1.5;
    display:none;
  }
  .explain-box.show{ display:block; }
  .explain-box b{ color:var(--blood); }
</style>
</head>
<body>
<div class="stripes"></div>
<header>
  <h1>🏈 Blood Bowl Skill Trainer</h1>
  <div class="sub">Third Season Edition (2025) — Skills, Traits &amp; Tactics</div>
</header>

<main>
  <div class="mode-bar">
    <button class="mode-btn active" data-mode="flash">Flashcards</button>
    <button class="mode-btn" data-mode="quiz">Skill Quiz</button>
    <button class="mode-btn" data-mode="tactics">Tactics</button>
  </div>

  <select id="categorySelect"></select>

  <div id="flashArea"></div>
  <div id="quizArea" style="display:none;"></div>
  <div id="tacticsArea" style="display:none;"></div>
</main>

<script>
const DATA = [
// GENERAL
{name:"Block", cat:"General", kind:"Elite / Active", desc:"Lets you shrug off a Both Down result in a block you're part of — you just don't fall over."},
{name:"Dauntless", cat:"General", kind:"Active", desc:"Rolls a die and adds it to your Strength when blocking a stronger opponent, letting scrawny players occasionally match brutes."},
{name:"Fend", cat:"General", kind:"Active", desc:"Stops the opposing player from following up into your square after they push you back."},
{name:"Frenzy", cat:"General", kind:"Active", desc:"Forces you to always follow up after pushing an opponent back, and to throw a second block at the same target if they're still standing."},
{name:"Kick", cat:"General", kind:"Active", desc:"The kicking player can shave squares off how far the ball scatters at kick-off."},
{name:"Pro", cat:"General", kind:"Active", desc:"Once during your activation, roll a D6 — on a 3+ you may re-roll any one dice, without burning a team re-roll."},
{name:"Steady Footing", cat:"General", kind:"Active", desc:"Whenever you'd be knocked down or fall over, roll a D6 — on a 6, you simply stay on your feet instead."},
{name:"Strip Ball", cat:"General", kind:"Active", desc:"Knocks the ball loose from a carrier who's pushed back by your block, even without knocking them down."},
{name:"Sure Hands", cat:"General", kind:"Active", desc:"Grants a re-roll for picking up the ball and makes it harder for opponents to strip it from you."},
{name:"Tackle", cat:"General", kind:"Active", desc:"Cancels the Dodge skill (and similar tricks) for opponents you block, making them fall more easily."},
{name:"Taunt", cat:"General", kind:"Active", desc:"If you're pushed back in a block, you can choose to force the attacker to follow up into your vacated square."},
{name:"Wrestle", cat:"General", kind:"Active", desc:"On a Both Down result, forces both players to hit the deck regardless of Block or other skills either one has."},

// AGILITY
{name:"Catch", cat:"Agility", kind:"Active", desc:"Grants a re-roll on any failed attempt to catch the ball."},
{name:"Defensive", cat:"Agility", kind:"Active", desc:"Cancels an opposing player's assist bonus during blocks made against your team-mates near you."},
{name:"Diving Catch", cat:"Agility", kind:"Active", desc:"Lets you attempt to catch a pass, kick-off, or throw-in that lands in your tackle zone (not a bounce), with a +1 bonus if you're the actual pass target."},
{name:"Diving Tackle", cat:"Agility", kind:"Active", desc:"Lets you throw yourself (going prone) to impose a penalty on a nearby opponent's dodge roll."},
{name:"Dodge", cat:"Agility", kind:"Elite / Active", desc:"Grants a re-roll when dodging out of a tackle zone, and softens a Stumble result against you into a Push Back."},
{name:"Hit and Run", cat:"Agility", kind:"Active", desc:"Lets you take a free move after a block, so long as you weren't pushed back yourself."},
{name:"Jump Up", cat:"Agility", kind:"Active", desc:"Lets a prone player stand up and act without spending the usual movement cost."},
{name:"Leap", cat:"Agility", kind:"Active", desc:"Allows jumping over an occupied or dangerous square instead of walking around it, with an Agility test."},
{name:"Safe Pair of Hands", cat:"Agility", kind:"Active", desc:"Stops the ball bouncing away when you're knocked down while carrying it — it just drops in your square."},
{name:"Sidestep", cat:"Agility", kind:"Active", desc:"Lets you choose which square you're pushed into, rather than the opponent choosing."},
{name:"Sprint", cat:"Agility", kind:"Active", desc:"Lets you attempt one additional Rush beyond your normal limit during a Move Action."},
{name:"Sure Feet", cat:"Agility", kind:"Active", desc:"Grants a re-roll when rushing (going beyond your normal Movement allowance)."},

// PASSING
{name:"Accurate", cat:"Passing", kind:"Active", desc:"Improves the odds of a short or quick pass landing on target."},
{name:"Cannoneer", cat:"Passing", kind:"Active", desc:"Boosts the range and reliability of your longest, hardest throws."},
{name:"Cloud Burster", cat:"Passing", kind:"Active", desc:"When you throw a pass, opponents cannot attempt to intercept it at all."},
{name:"Dump-off", cat:"Passing", kind:"Active", desc:"Lets you throw the ball away for free the instant you're about to be blocked, before the block is even resolved."},
{name:"Give and Go", cat:"Passing", kind:"Active", desc:"Lets you make a short move after completing a successful pass or hand-off."},
{name:"Hail Mary Pass", cat:"Passing", kind:"Active", desc:"Allows a desperate throw anywhere on the pitch with no range limit, though it can never land as accurate and can't be intercepted."},
{name:"Leader", cat:"Passing", kind:"Passive", desc:"Grants your team an extra team re-roll for as long as this player is on the pitch."},
{name:"Nerves of Steel", cat:"Passing", kind:"Active", desc:"Ignores penalties from being marked when throwing or catching."},
{name:"On the Ball", cat:"Passing", kind:"Active", desc:"Lets you dash up to 3 squares when an opponent declares a pass at a target, or toward the ball right after a kick-off before the Kick-off Event is rolled."},
{name:"Pass", cat:"Passing", kind:"Active", desc:"Grants a re-roll on a failed passing attempt."},
{name:"Punt", cat:"Passing", kind:"Active", desc:"Lets you move, then punt the ball downfield in a chosen direction as a special action — separate from the opening kick-off."},
{name:"Safe Pass", cat:"Passing", kind:"Active", desc:"Turns a fumbled pass (rolling a natural 1) into no turnover at all — you just keep the ball and your activation ends."},

// STRENGTH
{name:"Arm Bar", cat:"Strength", kind:"Active", desc:"If an opponent falls over failing to Dodge, Leap, or Jump out of your tackle zone, add a bonus to their armour or injury roll."},
{name:"Brawler", cat:"Strength", kind:"Active", desc:"Turns a Both Down result from a block into a win for you when there's no assist either way."},
{name:"Break Tackle", cat:"Strength", kind:"Active", desc:"Boosts your Strength for a single dodge roll, making it easier to slip away from strong markers."},
{name:"Bullseye", cat:"Strength", kind:"Active", desc:"Improves accuracy when throwing a team-mate at a specific target."},
{name:"Grab", cat:"Strength", kind:"Active", desc:"Lets you choose which square an opponent is pushed into after a block."},
{name:"Guard", cat:"Strength", kind:"Elite / Active", desc:"Keeps assisting a team-mate's block or defense even when you'd normally be too outnumbered to help."},
{name:"Juggernaut", cat:"Strength", kind:"Active", desc:"During a Blitz, turns a Both Down result into a Push Back, and ignores Fend, Stand Firm, and Wrestle used against you."},
{name:"Mighty Blow", cat:"Strength", kind:"Elite / Active", desc:"Adds a bonus to the armour or injury roll after knocking someone down in a block."},
{name:"Multiple Block", cat:"Strength", kind:"Active", desc:"Lets you throw a block at two adjacent opponents at once in a single action."},
{name:"Stand Firm", cat:"Strength", kind:"Active", desc:"Lets you choose to not be pushed back by a block at all."},
{name:"Strong Arm", cat:"Strength", kind:"Active", desc:"Improves the roll when throwing a team-mate down the pitch."},
{name:"Thick Skull", cat:"Strength", kind:"Passive", desc:"Reduces the chance of being knocked out (rather than just stunned) on the injury table."},

// DEVIOUS
{name:"Dirty Player", cat:"Devious", kind:"Active", desc:"Adds a bonus to the armour or injury roll specifically when fouling."},
{name:"Eye Gouge", cat:"Devious", kind:"Active", desc:"An opponent you push back with a block can't offer or receive assists until after their next activation."},
{name:"Fumblerooski", cat:"Devious", kind:"Active", desc:"Lets you leave the ball behind on the ground as you move, instead of carrying it further."},
{name:"Lethal Flight", cat:"Devious", kind:"Active", desc:"Adds a bonus to injury when a team-mate you've thrown lands on and flattens an opponent — and you get credit for the casualty."},
{name:"Lone Fouler", cat:"Devious", kind:"Active", desc:"Grants a re-roll on a foul's armour roll when fouling without any assists."},
{name:"Pile Driver", cat:"Devious", kind:"Active", desc:"Lets you follow up a successful knockdown block with an automatic free foul on the same opponent."},
{name:"Put the Boot In", cat:"Devious", kind:"Active", desc:"Lets you provide an assist on a team-mate's foul no matter how many opponents are marking you."},
{name:"Quick Foul", cat:"Devious", kind:"Active", desc:"Your activation doesn't end after fouling — you can still use any movement you have left."},
{name:"Saboteur", cat:"Devious", kind:"Passive", desc:"Can trigger a hidden weapon against whoever knocks you down, at the risk of harming yourself too."},
{name:"Shadowing", cat:"Devious", kind:"Active", desc:"Lets you try to stick to an opponent's heels as they try to dodge away from you."},
{name:"Sneaky Git", cat:"Devious", kind:"Active", desc:"Protects you from being sent off on a natural double when fouling, unless the target's armour actually breaks."},
{name:"Violent Innovator", cat:"Devious", kind:"Active", desc:"Earns you credit toward star player points when a special action of yours causes a casualty."},

// MUTATIONS
{name:"Big Hand", cat:"Mutations", kind:"Active", desc:"Ignores all negative modifiers when attempting to pick up the ball, weather included."},
{name:"Claws", cat:"Mutations", kind:"Passive", desc:"Ignores an opponent's armour bonus, making it easier to injure well-armoured players."},
{name:"Disturbing Presence", cat:"Mutations", kind:"Passive", desc:"Imposes a penalty on opposing passes and catches attempted near you."},
{name:"Extra Arms", cat:"Mutations", kind:"Active", desc:"Improves the odds of catching, intercepting, or picking up the ball."},
{name:"Foul Appearance", cat:"Mutations", kind:"Passive", desc:"Can cause opponents to flinch and waste their block action against you entirely."},
{name:"Horns", cat:"Mutations", kind:"Active", desc:"Adds a bonus to Strength specifically when blitzing."},
{name:"Iron Hard Skin", cat:"Mutations", kind:"Passive", desc:"Reduces the effectiveness of skills like Claws being used against your armour."},
{name:"Monstrous Mouth", cat:"Mutations", kind:"Active", desc:"Lets you 'Chomp' a marked standing opponent as a special action, trapping them in their square while you keep marking them."},
{name:"Prehensile Tail", cat:"Mutations", kind:"Active", desc:"Imposes a penalty on opponents trying to dodge away from you."},
{name:"Tentacles", cat:"Mutations", kind:"Active", desc:"Can grapple an adjacent opponent trying to dodge away, contested by a Strength roll-off."},
{name:"Two Heads", cat:"Mutations", kind:"Active", desc:"Grants a bonus when attempting to dodge out of a tackle zone."},
{name:"Very Long Legs", cat:"Mutations", kind:"Active", desc:"Improves your odds when leaping or jumping, and helps you intercept passes."},

// TRAITS
{name:"Always Hungry", cat:"Traits", kind:"Active", desc:"Risks eating the team-mate you're trying to throw, instead of completing the throw."},
{name:"Animal Savagery", cat:"Traits", kind:"Passive", desc:"Rolls before every activation; on a fail, this player lashes out and knocks down an adjacent team-mate instead of acting."},
{name:"Animosity (X)", cat:"Traits", kind:"Active", desc:"Requires a roll before this player will hand the ball off or pass to certain team-mates of a specific type."},
{name:"Ball and Chain", cat:"Traits", kind:"Active", desc:"Moves in a random direction each activation, smashing through anyone in the way, but can't be directly controlled."},
{name:"Bloodlust (X+)", cat:"Traits", kind:"Passive", desc:"Forces this player to bite a nearby Thrall team-mate for blood or suffer themselves, each turn."},
{name:"Bombardier", cat:"Traits", kind:"Active", desc:"Lets this player throw a bomb at a target square as a special action."},
{name:"Bone Head", cat:"Traits", kind:"Passive", desc:"Rolls before activating; on a fail, the player becomes Distracted and can't perform the declared action."},
{name:"Breathe Fire", cat:"Traits", kind:"Active", desc:"Lets this player torch a marked adjacent opponent, potentially knocking them down or prone."},
{name:"Chainsaw", cat:"Traits", kind:"Active", desc:"Lets this player attack with a chainsaw instead of a normal block, with its own randomness and risks."},
{name:"Decay", cat:"Traits", kind:"Passive", desc:"A downside, not a bonus — adds +1 to any casualty roll made against this player, making injuries worse."},
{name:"Drunkard", cat:"Traits", kind:"Passive", desc:"Applies a -1 penalty whenever this player attempts to Rush."},
{name:"Hatred (X)", cat:"Traits", kind:"Passive", desc:"Lets you re-roll a single Player Down result when blocking opponents of a specific hated type."},
{name:"Hypnotic Gaze", cat:"Traits", kind:"Active", desc:"Can freeze a nearby standing opponent in place, making them Distracted."},
{name:"Insignificant", cat:"Traits", kind:"Passive", desc:"A roster-building limit — you can't draft more players with this trait than players without it."},
{name:"Kick Team-mate", cat:"Traits", kind:"Passive", desc:"Lets a player boot a team-mate with the Right Stuff trait down the pitch as a special action, separate from a normal throw."},
{name:"Loner (X+)", cat:"Traits", kind:"Passive", desc:"Requires a roll before this player may benefit from a team re-roll at all."},
{name:"My Ball", cat:"Traits", kind:"Passive", desc:"This player can never willingly give up the ball — no passing or handing it off while they hold it."},
{name:"No Ball", cat:"Traits", kind:"Passive", desc:"Marks a player who simply cannot handle the ball in any way."},
{name:"Pick-me-up", cat:"Traits", kind:"Active", desc:"At the end of the opponent's turn, gives any prone team-mate within 3 squares a chance to stand back up for free."},
{name:"Plague Ridden", cat:"Traits", kind:"Passive", desc:"Once per game, if this player causes an opponent's death, you may add a fresh lineman to your Reserves for the rest of the game."},
{name:"Pogo", cat:"Traits", kind:"Active", desc:"Lets this player jump over an adjacent square like a Leap, ignoring all the usual negative modifiers."},
{name:"Projectile Vomit", cat:"Traits", kind:"Active", desc:"Lets this player launch an unpleasant ranged attack instead of a normal action."},
{name:"Really Stupid", cat:"Traits", kind:"Passive", desc:"Requires a roll (helped by a nearby team-mate) before this player can act at all."},
{name:"Regeneration", cat:"Traits", kind:"Passive", desc:"Gives a second chance to shrug off a serious casualty result on the injury table."},
{name:"Right Stuff", cat:"Traits", kind:"Passive", desc:"Marks a player small and light enough to be thrown by a team-mate."},
{name:"Secret Weapon", cat:"Traits", kind:"Passive", desc:"This player is automatically sent off for fouling at the end of any drive they took part in."},
{name:"Stab", cat:"Traits", kind:"Active", desc:"Lets this player make an unmodified armour-roll stabbing attack against a marked standing opponent as a special action."},
{name:"Stunty", cat:"Traits", kind:"Passive", desc:"Ignores the usual penalty for being marked when dodging, but is worse at intercepting and rolls on the harsher Stunty injury table."},
{name:"Swoop", cat:"Traits", kind:"Active", desc:"Lets a thrown player skip the normal scatter and pick a direct line of travel instead, with a re-roll on the landing roll."},
{name:"Take Root", cat:"Traits", kind:"Passive", desc:"Risks rooting this player to the spot at the end of a move, unable to act further that turn."},
{name:"Throw Team-mate", cat:"Traits", kind:"Active", desc:"Grants the ability to declare a Throw Team-mate Action, hurling a Right Stuff team-mate down the field."},
{name:"Timmm-ber!", cat:"Traits", kind:"Passive", desc:"A slow, low-Movement player gets help standing up from each adjacent open standing team-mate."},

let guideIdx = 0;
let tacticsSub = "guide";
let scenarioPool = [];
let scenarioIdx = 0;

const CATS = ["All", ...Array.from(new Set(DATA.map(d=>d.cat)))];
let currentCat = "All";
let mode = "flash";
let flashIdx = 0;
let quizPool = [];
let quizIdx = 0;
let score = 0, answered = 0;

const catSelect = document.getElementById('categorySelect');
CATS.forEach(c=>{
  const opt = document.createElement('option');
  opt.value = c; opt.textContent = c === "All" ? "All Categories" : c;
  catSelect.appendChild(opt);
});
catSelect.addEventListener('change', ()=>{
  currentCat = catSelect.value;
  flashIdx = 0;
  buildQuizPool();
  quizIdx = 0; score = 0; answered = 0;
  render();
});

document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    document.getElementById('flashArea').style.display = mode==='flash' ? 'block':'none';
    document.getElementById('quizArea').style.display = mode==='quiz' ? 'block':'none';
    document.getElementById('tacticsArea').style.display = mode==='tactics' ? 'block':'none';
    document.getElementById('categorySelect').style.display = mode==='tactics' ? 'none':'block';
    if(mode==='quiz'){ buildQuizPool(); quizIdx=0; score=0; answered=0; }
    if(mode==='tactics'){ scenarioPool = shuffle(SCENARIOS.slice()); scenarioIdx = 0; }
    render();
  });
});

function currentPool(){
  return currentCat==="All" ? DATA : DATA.filter(d=>d.cat===currentCat);
}

function buildQuizPool(){
  quizPool = shuffle(currentPool().slice());
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function renderFlash(){
  const pool = currentPool();
  if(flashIdx >= pool.length) flashIdx = 0;
  const item = pool[flashIdx];
  const area = document.getElementById('flashArea');
  area.innerHTML = `
    <div class="stat-row"><span>Card ${flashIdx+1} / ${pool.length}</span><span>${currentCat}</span></div>
    <div class="card" id="flipCard" data-flipped="0">
      <span class="tag">${item.cat}</span>
      <span class="kind">${item.kind}</span>
      <div id="cardFront">
        <h2>${item.name}</h2>
        <div class="hint">Tap card to reveal what it does</div>
      </div>
    </div>
    <div class="flip-controls">
      <button class="btn-prev" id="prevBtn">◀ Prev</button>
      <button class="btn-next" id="nextBtn">Next ▶</button>
    </div>
  `;
  document.getElementById('flipCard').addEventListener('click', function(){
    const flipped = this.dataset.flipped === "1";
    if(!flipped){
      this.dataset.flipped = "1";
      document.getElementById('cardFront').innerHTML = `<h2>${item.name}</h2><p>${item.desc}</p><div class="hint">Tap to flip back</div>`;
    } else {
      this.dataset.flipped = "0";
      document.getElementById('cardFront').innerHTML = `<h2>${item.name}</h2><div class="hint">Tap card to reveal what it does</div>`;
    }
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    flashIdx = (flashIdx - 1 + pool.length) % pool.length;
    renderFlash();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    flashIdx = (flashIdx + 1) % pool.length;
    renderFlash();
  });
}

function renderQuiz(){
  const area = document.getElementById('quizArea');
  if(quizPool.length < 4){
    area.innerHTML = `<div class="q-card"><div class="q-prompt">Pick a category with at least 4 skills to quiz on!</div></div>`;
    return;
  }
  if(quizIdx >= quizPool.length){
    buildQuizPool();
    quizIdx = 0;
  }
  const correctItem = quizPool[quizIdx];
  // build 3 distractors from same pool (prefer same category flavor already guaranteed by currentPool)
  const distractorSource = currentPool().filter(d=>d.name !== correctItem.name);
  const distractors = shuffle(distractorSource.slice()).slice(0,3);
  const options = shuffle([correctItem, ...distractors]);

  area.innerHTML = `
    <div class="stat-row"><span>Question ${quizIdx+1}</span><span>Score: ${score}/${answered}</span></div>
    <div class="q-card">
      <div class="q-prompt"><strong>${correctItem.cat} skill</strong> — which skill does this?<br><br>"${correctItem.desc}"</div>
      <div id="choicesWrap"></div>
      <button class="next-q" id="nextQBtn">Next Question ▶</button>
    </div>
  `;
  const wrap = document.getElementById('choicesWrap');
  options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = opt.name;
    b.addEventListener('click', ()=>{
      const buttons = wrap.querySelectorAll('.choice');
      buttons.forEach(btn=>btn.disabled = true);
      answered++;
      if(opt.name === correctItem.name){
        b.classList.add('correct');
        score++;
      } else {
        b.classList.add('wrong');
        buttons.forEach(btn=>{ if(btn.textContent === correctItem.name) btn.classList.add('correct'); });
      }
      document.getElementById('nextQBtn').classList.add('show');
      updateScoreDisplay();
    });
    wrap.appendChild(b);
  });
  document.getElementById('nextQBtn').addEventListener('click', ()=>{
    quizIdx++;
    renderQuiz();
  });
}

function updateScoreDisplay(){
  const row = document.querySelector('#quizArea .stat-row span:last-child');
  if(row) row.textContent = `Score: ${score}/${answered}`;
}

function renderTactics(){
  const area = document.getElementById('tacticsArea');
  area.innerHTML = `
    <div class="sub-toggle">
      <button id="subGuide" class="${tacticsSub==='guide'?'active':''}">Reference Guides</button>
      <button id="subScenario" class="${tacticsSub==='scenario'?'active':''}">Scenario Challenge</button>
    </div>
    <div id="tacticsInner"></div>
  `;
  document.getElementById('subGuide').addEventListener('click', ()=>{ tacticsSub='guide'; renderTactics(); });
  document.getElementById('subScenario').addEventListener('click', ()=>{ tacticsSub='scenario'; renderTactics(); });

  if(tacticsSub === 'guide'){
    renderGuideList();
  } else {
    renderScenario();
  }
}

function renderGuideList(){
  const inner = document.getElementById('tacticsInner');
  const chips = GUIDES.map((g,i)=>`<button class="topic-chip ${i===guideIdx?'active':''}" data-i="${i}">${g.title}</button>`).join('');
  const g = GUIDES[guideIdx];
  inner.innerHTML = `
    <div class="topic-list">${chips}</div>
    <div class="guide-card">
      <h3>${g.title}</h3>
      <div class="goal">${g.goal}</div>
      <ul>${g.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>
  `;
  inner.querySelectorAll('.topic-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      guideIdx = parseInt(chip.dataset.i, 10);
      renderGuideList();
    });
  });
}

function renderScenario(){
  const inner = document.getElementById('tacticsInner');
  if(scenarioIdx >= scenarioPool.length){
    scenarioPool = shuffle(SCENARIOS.slice());
    scenarioIdx = 0;
  }
  const s = scenarioPool[scenarioIdx];
  inner.innerHTML = `
    <div class="stat-row"><span>Scenario ${scenarioIdx+1} / ${scenarioPool.length}</span><span>Best Approach?</span></div>
    <div class="q-card">
      <span class="scenario-tag">On the pitch</span>
      <div class="q-prompt">${s.situation}</div>
      <div id="scenarioChoices"></div>
      <div class="explain-box" id="explainBox"></div>
      <button class="next-q" id="nextScenarioBtn">Next Scenario ▶</button>
    </div>
  `;
  const wrap = document.getElementById('scenarioChoices');
  s.options.forEach((optText, i)=>{
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = optText;
    b.addEventListener('click', ()=>{
      wrap.querySelectorAll('.choice').forEach(btn=>btn.disabled = true);
      if(i === s.correct){
        b.classList.add('correct');
      } else {
        b.classList.add('wrong');
        wrap.querySelectorAll('.choice')[s.correct].classList.add('correct');
      }
      const box = document.getElementById('explainBox');
      box.innerHTML = s.explanation;
      box.classList.add('show');
      document.getElementById('nextScenarioBtn').classList.add('show');
    });
    wrap.appendChild(b);
  });
  document.getElementById('nextScenarioBtn').addEventListener('click', ()=>{
    scenarioIdx++;
    renderScenario();
  });
}

function render(){
  if(mode==='flash') renderFlash();
  else if(mode==='quiz') renderQuiz();
  else renderTactics();
}

buildQuizPool();
render();
</script>
